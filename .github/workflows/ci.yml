name: Continuous Integration (CI) Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  ci-pipeline:
    name: Build, Lint, Test & Dockerize
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js runtime with npm cache
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Clean install of dependencies from package-lock.json
      - name: Install Dependencies
        run: npm ci

      # 4. Lint code for style and syntax consistency
      - name: Run ESLint
        run: npm run lint

      # 5. Build NestJS application to verify TypeScript compilation
      - name: Build Application
        run: npm run build

      # 6. Run automated business logic unit and integration tests
      - name: Run Automated Tests
        run: npm test -- --ci --runInBand

      # 7. Build Docker container image to ensure deployment readiness
      - name: Build Docker Image
        run: docker build -t clearlink-chat-backend:latest .

