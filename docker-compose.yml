version: '3.8'

services:
  # ==========================================
  # MongoDB Database Service
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: chat_mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-clearlink}
    volumes:
      - mongodb_data:/data/db
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # Redis Real-Time State Service
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: chat_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================
  # NestJS Application Backend
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3005}:3005"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: local
      PORT: 3005
      ADMIN_PORT: 3005
      # Connect to MongoDB via internal Docker service hostname
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-clearlink}
      MONGODB_URI: mongodb://mongodb:27017/${MONGODB_DB_NAME:-clearlink}
      # Connect to Redis via internal Docker service hostname
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # JWT configuration
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # LiveKit RTC credentials
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://demo.livekit.cloud}
    networks:
      - chat-network

# Dedicated bridge network for inter-container communication
networks:
  chat-network:
    driver: bridge

# Named persistent volumes
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

